<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Lleve - Turma Tienda</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Iconos Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-primary: #597928;
      --color-text-main: #1f2937;
      --color-text-muted: #6b7280;
      --color-border: #bbf7d0;
      --color-bg-page: #f8fafc;
      --color-card-bg: #ffffff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--color-bg-page);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header con botón de volver */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 10px 0;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-back:hover {
      background: #f0fdf4;
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-spacer {
      width: 40px; /* Balancea visualmente con el botón de retroceso */
    }

    /* Enlaces / Opciones */
    .portal-nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .portal-item {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(95, 158, 160, 0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .portal-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(95, 158, 160, 0.25);
      border-color: var(--color-primary);
    }

    .portal-item:active {
      transform: translateY(0);
    }

    .prod-thumb {
      width: 90px;
      height: 90px;
      object-fit: cover;
      flex-shrink: 0;
      background: #e2e8f0;
    }

    .prod-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 0;
      padding: 8px 0;
    }

    .prod-name {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--color-text-main);
    }

    .badge-stock {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .chevron {
      margin-right: 14px;
      color: #9ca3af;
      flex-shrink: 0;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .portal-item:hover .chevron {
      color: var(--color-primary);
      transform: translateX(3px);
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--color-text-muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <!-- Enlace para volver a la página principal -->
      <a href="index.html" class="btn-back" title="Volver al inicio" aria-label="Volver al inicio">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
      </a>

      <div class="brand">
        <div class="logo-badge">
          <i data-lucide="shopping-bag" style="width: 22px; height: 22px;"></i>
        </div>
        <h1 class="brand-title">El Lleve</h1>
      </div>

      <div class="header-spacer" aria-hidden="true"></div>
    </header>

    <nav class="portal-nav" aria-label="Categorías de El Lleve">
      <!-- Opción 1: Aceites -->
      <a href="/aceites.html" class="portal-item">
        <img src="https://placehold.co/100x100/dbf6e4/597928" alt="Aceites" class="prod-thumb">
        <div class="prod-info">
          <span class="prod-name">Aceites</span>
          <span class="badge-stock">Aceite de Oliva</span>
        </div>
        <i data-lucide="chevron-right" class="chevron" style="width: 20px; height: 20px;"></i>
      </a>

      <!-- Opción 2: Yerba -->
      <a href="#" class="portal-item">
        <img src="https://placehold.co/100x100/dbf6e4/597928" alt="Yerba" class="prod-thumb">
        <div class="prod-info">
          <span class="prod-name">Yerba</span>
          <span class="badge-stock">Agroecológica y tradicional</span>
        </div>
        <i data-lucide="chevron-right" class="chevron" style="width: 20px; height: 20px;"></i>
      </a>

      <!-- Opción 3: Vinos -->
      <a href="#" class="portal-item">
        <img src="https://placehold.co/100x100/dbf6e4/597928" alt="Vinos" class="prod-thumb">
        <div class="prod-info">
          <span class="prod-name">Vinos</span>
          <span class="badge-stock">Orgánicos y de autor</span>
        </div>
        <i data-lucide="chevron-right" class="chevron" style="width: 20px; height: 20px;"></i>
      </a>
    </nav>

    <footer>
      <span>Turma Tienda v1.0</span>
    </footer>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
