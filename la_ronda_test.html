<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Ronda</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --color-primary: #d97706;
      --color-primary-hover: #b45309;
      --color-primary-light: #fef3c7;
      --color-bg-surface: #ffffff;
      --color-text-main: #0f172a;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
      --color-bg-page: #f8fafc;
      --color-card-bg: #ffffff;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--color-bg-page);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px 120px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      gap: 10px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text-main);
      text-decoration: none;
      flex-shrink: 0;
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .btn-back:hover {
      background: var(--color-primary-light);
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-badge {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      flex-shrink: 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ef4444;
    }

    .status-dot.online { background-color: #10b981; }
    .status-dot.syncing { background-color: #f59e0b; }

    /* Pestañas de Navegación */
    .tabs-nav {
      display: flex;
      gap: 8px;
      background: #eef2f6;
      padding: 4px;
      border-radius: var(--radius-md);
    }

    .tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--color-card-bg);
      color: var(--color-primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-pane.active {
      display: flex;
    }

    /* Cards */
    .card {
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 4px 12px rgba(95, 158, 160, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-primary);
    }

    /* Barra de Categorías */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .cat-chip {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-bg-page);
      color: var(--color-text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-chip.active {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }

    /* Lista de Productos */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-card-bg);
      overflow: hidden;
      padding-right: 12px;
      box-shadow: 0 4px 10px rgba(95, 158, 160, 0.12);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-item:hover {
      border-color: var(--color-primary);
    }

    .product-item.item-agotado {
      opacity: 0.6;
      filter: grayscale(0.8);
    }

    .prod-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .prod-thumb {
      width: 80px;
      height: 80px;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      object-fit: cover;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .prod-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      padding: 6px 0;
    }

    .prod-name {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--color-text-main);
    }

    .prod-price {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--color-primary);
    }

    .badge-stock {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--color-text-muted);
    }

    .badge-stock.exhausted {
      color: #ef4444;
      font-weight: 700;
    }

    /* Stepper (+ / -) */
    .stepper {
      display: inline-flex;
      align-items: center;
      background: var(--color-bg-page);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
    }

    .stepper button {
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--color-text-main);
      transition: background 0.2s ease;
    }

    .stepper button:hover:not(:disabled) {
      background: #e5e7eb;
    }

    .stepper button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .stepper-val {
      min-width: 28px;
      text-align: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Formulario de Datos */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .field-group select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg-page);
      color: var(--color-text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .field-group select:focus {
      border-color: var(--color-primary);
      background: #ffffff;
    }

    /* Summary Card Fijo */
    .summary-card {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--color-border);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06);
      z-index: 50;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .summary-amount {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--color-primary);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--color-primary);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, opacity 0.2s ease;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--color-primary-hover);
    }

    .btn-submit:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Tarjetas del Historial de Pedidos */
    .order-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 14px;
      background: var(--color-bg-page);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: 10px;
    }

    .order-item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .order-item-total {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--color-primary);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-pendiente { background: #fee2e2; color: #b91c1c; }
    .status-pagado { background: #dcfce7; color: #15803d; }
    .status-parcial { background: #fef3c7; color: #b45309; }
    .status-proceso { background: #e0f2fe; color: #0369a1; }
    .status-entregado { background: #f3e8ff; color: #6b21a8; }

    .receipt-upload-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
      padding-top: 8px;
      border-top: 1px dashed var(--color-border);
    }

    .mp-btn, .receipt-link-pill, .btn-upload-receipt {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--color-border);
      background: #ffffff;
      color: var(--color-text-main);
      transition: all 0.2s ease;
    }

    .mp-btn {
      background: #009ee3;
      color: #fff;
      border-color: #009ee3;
    }

    .mp-btn:hover { background: #0082ba; }
    .btn-upload-receipt:hover, .receipt-link-pill:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--color-card-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--color-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-detail-box {
      font-size: 0.9rem;
      line-height: 1.5;
      background: var(--color-bg-page);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 12px;
      max-height: 240px;
      overflow-y: auto;
    }

    .btn-wa-action, .btn-mp-action, .btn-close-modal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      font-size: 0.9rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-wa-action {
      background: #25d366;
      color: #fff;
    }
    .btn-wa-action:hover { background: #1ebd5a; }

    .btn-mp-action {
      background: #009ee3;
      color: #fff;
    }
    .btn-mp-action:hover { background: #0082ba; }

    .btn-close-modal {
      background: #f1f5f9;
      color: var(--color-text-main);
    }
    .btn-close-modal:hover { background: #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="index.html" class="btn-back" title="Volver al inicio" aria-label="Volver al inicio">
        <i data-lucide="arrow-left" style="width: 20px; height: 20px;"></i>
      </a>

      <div class="brand">
        <div class="logo-badge"><i data-lucide="circle-dot" style="width:20px;height:20px;"></i></div>
        <span class="brand-title" id="storeNameDisplay">La Ronda</span>
      </div>    
      
      <div class="status-badge">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusLabel">Conectando...</span>
      </div>
    </header>

    <div class="tabs-nav">
      <button class="tab-btn active" id="tabCatalogBtn"><i data-lucide="shopping-bag" style="width: 18px !important;"></i> PRODUCTOS</button>
      <button class="tab-btn" id="tabOrdersBtn"><i data-lucide="clock" style="width: 18px !important;"></i> PEDIDOS</button>
    </div>

    <!-- PESTAÑA PRODUCTOS -->
    <div class="tab-pane active" id="paneCatalog">
      <section class="card">
        <div class="categories-bar" id="categoryBar"></div>
        <div class="product-list" id="productList"></div>
      </section>

      <section class="card">
        <h2 class="section-title"><i data-lucide="user-check" style="width:18px;height:18px;"></i> Datos</h2>
        <div class="field-group">
          <label>Vendedor</label>
          <select id="selectComprador"><option value="">Cargando lista...</option></select>
        </div>
        <div class="field-group">
          <label>Retiro</label>
          <select id="selectRetiro"><option value="">Cargando puntos de retiro...</option></select>
        </div>
      </section>
    </div>

    <!-- PESTAÑA PEDIDOS -->
    <div class="tab-pane" id="paneOrders">
      <section class="card">
        <h2 class="section-title" style="display:none;"><i data-lucide="list-ordered" style="width:18px;height:18px;"></i> Historial de Pedidos</h2>
        <div id="ordersList"></div>
      </section>
    </div>
  </div>

  <!-- Summary Card Fijo -->
  <div class="summary-card" id="summaryCard">
    <div class="summary-row">
      <span class="summary-label">Total del Pedido</span>
      <span class="summary-amount" id="totalDisplay">$ 0</span>
    </div>
    <button class="btn-submit" id="btnSubmit" disabled>
      <span id="btnSubmitText">Hacer Pedido</span>
      <i data-lucide="arrow-right" style="display: none;"></i>
    </button>
  </div>

  <!-- Modal de Pedido Registrado -->
  <div class="modal-overlay" id="orderModal">
    <div class="modal">
      <h3 class="modal-title"><i data-lucide="check-circle" style="width:24px;height:24px;"></i> Pedido registrado</h3>
      <div class="modal-detail-box" id="modalDetail"></div>
      
      <a href="#" id="btnWaLink" target="_blank" class="btn-wa-action">
        <i data-lucide="message-circle" style="width:18px;height:18px;"></i> Informar pedido por WhatsApp
      </a>
      
      <a href="https://mercadopago.com" target="_blank" class="btn-mp-action">
        <i data-lucide="credit-card" style="width:18px;height:18px;"></i> Pagar Pedido
      </a>

      <button type="button" class="btn-close-modal" id="btnCloseOrderModal">Cerrar y Continuar</button>
    </div>
  </div>
  
  <input type="file" id="receiptFileInput" style="display:none;" accept="image/*,.pdf" />

  <script>
    // ========================================================
    // PEGA AQUÍ LA URL DE TU IMPLEMENTACIÓN DE APPS SCRIPT
    // ========================================================
    const GOOGLE_SCRIPT_URL = ""; 
    
    let state = {
      nombreTienda: "Tienda",
      compradores: [],
      puntosRetiro: [],
      selectedCategory: "Todas",
      pedidos: [],
      productos: []
    };

    let pendingUploadOrderId = null;

    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const storeNameDisplay = document.getElementById('storeNameDisplay');
    const selectComprador = document.getElementById('selectComprador');
    const selectRetiro = document.getElementById('selectRetiro');
    const orderModal = document.getElementById('orderModal');
    const receiptFileInput = document.getElementById('receiptFileInput');

    async function fetchSheetData() {
      if (!GOOGLE_SCRIPT_URL) {
        statusLabel.textContent = 'Sin URL configurada';
        return;
      }

      statusDot.className = 'status-dot syncing';
      statusLabel.textContent = 'Sincronizando...';

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const json = await response.json();

        if (json && json.status === 'success') {
          state.nombreTienda = json.nombreTienda || "Mi Tienda";
          document.title = state.nombreTienda;
          storeNameDisplay.textContent = state.nombreTienda;

          state.compradores = json.compradores || [];
          state.puntosRetiro = json.puntosRetiro || [];
          
          state.productos = (json.productos || []).map(p => ({
            ...p,
            precio: Number(p.precio) || 0,
            stock: Number(p.stock) || 0,
            cant: 0
          }));
          
          state.pedidos = json.pedidos || [];

          statusDot.className = 'status-dot online';
          statusLabel.textContent = 'En línea';
        }
      } catch (err) {
        console.error("Error al sincronizar con Sheets:", err);
        statusDot.className = 'status-dot';
        statusLabel.textContent = 'Desconectado';
      }

      populateSelects();
      renderCategories();
      renderProducts();
      renderOrders();
    }

    function formatImageUrl(url) {
      const placeholder = 'https://placehold.co/100x100/dbf6e4/597928?text=Sin+Foto';
      if (!url) return placeholder;
      const cleanUrl = String(url).trim();
      if (!cleanUrl) return placeholder;
      if (cleanUrl.includes('drive.google.com') || cleanUrl.includes('googleusercontent.com')) {
        const idMatch = cleanUrl.match(/\/d\/([a-zA-Z0-9_-]+)/) || cleanUrl.match(/id=([a-zA-Z0-9_-]+)/);
        if (idMatch && idMatch[1]) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w500`;
      } else if (!cleanUrl.startsWith('http') && cleanUrl.length > 15 && !cleanUrl.includes('/')) {
        return `https://drive.google.com/thumbnail?id=${cleanUrl}&sz=w500`;
      }
      return cleanUrl;
    }

    function populateSelects() {
      const currComp = selectComprador.value;
      selectComprador.innerHTML = '<option value="" disabled selected>Vendedor...</option>';
      state.compradores.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        if (c === currComp) opt.selected = true;
        selectComprador.appendChild(opt);
      });

      const currRet = selectRetiro.value;
      selectRetiro.innerHTML = '<option value="" disabled selected>Punto de Retiro...</option>';
      state.puntosRetiro.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        if (p === currRet) opt.selected = true;
        selectRetiro.appendChild(opt);
      });
    }

    function renderCategories() {
      const cats = ["Todas", ...new Set(state.productos.map(p => p.categoria || "General"))];
      document.getElementById('categoryBar').innerHTML = cats.map(c => 
        `<button class="cat-chip ${state.selectedCategory === c ? 'active' : ''}" onclick="selectCategory('${c}')">${c}</button>`
      ).join('');
    }

    window.selectCategory = function(cat) {
      state.selectedCategory = cat;
      renderCategories();
      renderProducts();
    };

    function renderProducts() {
      const list = document.getElementById('productList');
      const filtered = state.selectedCategory === "Todas" ? state.productos : state.productos.filter(p => p.categoria === state.selectedCategory);
      
      list.innerHTML = filtered.map(p => {
        const isAgotado = p.stock <= 0;
        return `
        <div class="product-item ${isAgotado ? 'item-agotado' : ''}">
          <div class="prod-main">
            <img src="${formatImageUrl(p.imagen)}" class="prod-thumb" alt="${p.nombre}" onerror="this.onerror=null; this.src='https://placehold.co/100x100/dbf6e4/597928?text=Sin+Foto';">
            <div class="prod-info">
              <div class="prod-name">${p.nombre}</div>
              <div class="prod-price">$ ${p.precio.toLocaleString('es-AR')}</div>
              <div class="badge-stock ${isAgotado ? 'exhausted' : ''}">${isAgotado ? 'Agotado' : 'Stock: ' + p.stock}</div>
            </div>
          </div>
          <div class="stepper">
            <button onclick="updateQty('${p.id}', -1)" ${p.cant === 0 || isAgotado ? 'disabled' : ''}>
               <i data-lucide="minus" style="width:14px;height:14px;"></i>
            </button>
            <span class="stepper-val">${p.cant}</span>
            <button onclick="updateQty('${p.id}', 1)" ${p.cant >= p.stock || isAgotado ? 'disabled' : ''}>
               <i data-lucide="plus" style="width:14px;height:14px;"></i>
            </button>
          </div>
        </div>
        `;
      }).join('');
      
      if (window.lucide) lucide.createIcons();
      updateTotal();
    }

    window.updateQty = function(id, delta) {
      const p = state.productos.find(x => String(x.id) === String(id));
      if (p) {
        const newQty = p.cant + delta;
        if (newQty >= 0 && newQty <= p.stock) {
          p.cant = newQty;
          renderProducts();
        }
      }
    };

    function updateTotal() {
      const total = state.productos.reduce((sum, p) => sum + (p.cant * p.precio), 0);
      document.getElementById('totalDisplay').textContent = `$ ${total.toLocaleString('es-AR')}`;
      
      const hasItems = state.productos.some(p => p.cant > 0);
      document.getElementById('btnSubmit').disabled = !(hasItems && selectComprador.value && selectRetiro.value);
    }

    selectComprador.addEventListener('change', updateTotal);
    selectRetiro.addEventListener('change', updateTotal);

    // Registro de Pedido
    document.getElementById('btnSubmit').addEventListener('click', async () => {
      const itemsComprados = state.productos
        .filter(p => p.cant > 0)
        .map(p => ({
          id: p.id,
          nombre: p.nombre,
          precio: p.precio,
          cantidad: p.cant
        }));

      if (itemsComprados.length === 0) return;

      const total = itemsComprados.reduce((sum, p) => sum + (p.cantidad * p.precio), 0);
      const orderId = 'PED-' + Math.floor(1000 + Math.random() * 9000);
      const now = new Date();
      const fecha = now.toLocaleDateString('es-AR') + ' ' + now.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
      const resumenStr = itemsComprados.map(p => `${p.cantidad}x ${p.nombre}`).join(', ');

      const payload = {
        action: 'nuevoPedido',
        orderId: orderId,
        comprador: selectComprador.value,
        retiro: selectRetiro.value,
        resumen: resumenStr,
        items: itemsComprados.map(p => ({ id: p.id, nombre: p.nombre, cantidad: p.cantidad }))
      };

      document.getElementById('btnSubmitText').textContent = 'Enviando...';
      document.getElementById('btnSubmit').disabled = true;

      // Detalle del modal
      const itemsDetalle = itemsComprados.map(p => 
        `• <strong>${p.cantidad}x</strong> ${p.nombre} ($${(p.cantidad * p.precio).toLocaleString('es-AR')})`
      ).join('<br>');

      document.getElementById('modalDetail').innerHTML = `
        <strong>Nº Pedido:</strong> ${orderId}<br>
        <strong>Comprador:</strong> ${selectComprador.value}<br>
        <strong>Punto de Retiro:</strong> ${selectRetiro.value}<br>
        <hr style="margin:8px 0; border:none; border-top:1px solid var(--color-border);">
        <strong>Detalle:</strong><br>${itemsDetalle}<br>
        <hr style="margin:8px 0; border:none; border-top:1px solid var(--color-border);">
        <strong style="color:var(--color-primary); font-size:1.05rem;">Total: $${total.toLocaleString('es-AR')}</strong>
      `;

      // Mensaje de WhatsApp
      const itemsWa = itemsComprados.map(p => ` - *${p.cantidad}x* ${p.nombre} ($${(p.cantidad * p.precio).toLocaleString('es-AR')})`).join('\n');
      const msgWa = `*${state.nombreTienda}* | *Pedido Registrado*%0A%0A` +
                    `*Nº Pedido:* ${orderId}%0A` +
                    `*Comprador:* ${encodeURIComponent(selectComprador.value)}%0A` +
                    `*Retiro:* ${encodeURIComponent(selectRetiro.value)}%0A%0A` +
                    `*Detalle:*%0A${encodeURIComponent(itemsWa)}%0A%0A` +
                    `*Total:* $${total.toLocaleString('es-AR')}`;
      
      document.getElementById('btnWaLink').href = `https://wa.me/?text=${msgWa}`;

      // Descontar stock localmente y limpiar stepper
      itemsComprados.forEach(c => {
        const prod = state.productos.find(x => String(x.id) === String(c.id));
        if (prod) {
          prod.stock = Math.max(0, prod.stock - c.cantidad);
          prod.cant = 0;
        }
      });

      // Agregar pedido al historial local
      state.pedidos.unshift({
        fecha: fecha,
        orderId: orderId,
        comprador: selectComprador.value,
        retiro: selectRetiro.value,
        total: total,
        estadoPago: "Pendiente de Pago",
        comprobanteUrl: "",
        resumen: resumenStr
      });

      orderModal.classList.add('active');
      document.getElementById('btnSubmitText').textContent = 'Hacer Pedido';
      renderProducts();
      updateTotal();

      // Enviar al Apps Script
      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Error al registrar pedido en backend:", err);
      }
    });

    document.getElementById('btnCloseOrderModal').onclick = () => orderModal.classList.remove('active');

    // Gestión del Historial y Lectura de Estados de Cobranza
    function getStatusChip(rawEstado) {
      const est = String(rawEstado || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");

      if (est.includes("entregado")) {
        return `<span class="status-chip status-entregado"><i data-lucide="package-check" style="width:12px;height:12px;"></i> Pedido Entregado</span>`;
      }
      if (est.includes("parcial")) {
        return `<span class="status-chip status-parcial"><i data-lucide="pie-chart" style="width:12px;height:12px;"></i> Pago Parcial</span>`;
      }
      if (est.includes("pagad")) {
        return `<span class="status-chip status-pagado"><i data-lucide="check-circle" style="width:12px;height:12px;"></i> Pagado</span>`;
      }
      if (est.includes("proceso")) {
        return `<span class="status-chip status-proceso"><i data-lucide="clock" style="width:12px;height:12px;"></i> En Proceso</span>`;
      }
      return `<span class="status-chip status-pendiente"><i data-lucide="alert-circle" style="width:12px;height:12px;"></i> ${rawEstado || 'Pendiente de Pago'}</span>`;
    }

    function renderOrders() {
      const list = document.getElementById('ordersList');
      if (state.pedidos.length === 0) {
        list.innerHTML = '<div style="text-align:center;padding:24px;color:var(--color-text-muted);">Sin pedidos registrados aún.</div>';
        return;
      }
      
      list.innerHTML = state.pedidos.map(p => {
        const urls = p.comprobanteUrl ? String(p.comprobanteUrl).split(/[,\n]+/).map(u => u.trim()).filter(Boolean) : [];
        const chipsComprobantes = urls.map((url, idx) => `
          <a href="${url}" target="_blank" class="receipt-link-pill">
            <i data-lucide="file-text" style="width:12px;height:12px;"></i> Comp. ${idx + 1}
          </a>
        `).join('');

        return `
        <div class="order-item" id="order-card-${p.orderId}">
          <div>${getStatusChip(p.estadoPago)}</div>
          <div class="order-item-header">
            <div>
              <strong>${p.orderId}</strong> - ${p.comprador}
              <div style="font-size:0.75rem; color:var(--color-text-muted);">${p.fecha || ''} | ${p.retiro || ''}</div>
            </div>
            <div class="order-item-total">$ ${Number(p.total).toLocaleString('es-AR')}</div>
          </div>
          <div style="font-size:0.85rem; color:var(--color-text-muted);">${p.resumen || ''}</div>
          
          <div class="receipt-upload-box">
            <a href="https://mercadopago.com" target="_blank" class="mp-btn">
              <i data-lucide="credit-card" style="width:13px;height:13px;"></i> Pagar Pedido
            </a>
            
            ${chipsComprobantes}

            <button type="button" class="btn-upload-receipt" onclick="triggerReceiptUpload('${p.orderId}')">
              <i data-lucide="upload" style="width:13px;height:13px;"></i> Subir Comprobante
            </button>
          </div>
        </div>
        `;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    // Subida de Comprobantes
    window.triggerReceiptUpload = function(orderId) {
      pendingUploadOrderId = orderId;
      receiptFileInput.value = '';
      receiptFileInput.click();
    };

    receiptFileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file || !pendingUploadOrderId) return;

      const orderId = pendingUploadOrderId;
      alert(`Subiendo comprobante para el pedido ${orderId}...`);

      try {
        const base64 = await fileToBase64(file);
        const payload = {
          action: 'uploadReceipt',
          orderId: orderId,
          fileName: `Comp_${orderId}_${Date.now()}_${file.name}`,
          mimeType: file.type,
          base64: base64
        };

        const res = await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        const json = await res.json();

        if (json && json.status === 'success') {
          const ord = state.pedidos.find(p => String(p.orderId) === String(orderId));
          if (ord) {
            ord.comprobanteUrl = ord.comprobanteUrl ? ord.comprobanteUrl + "," + json.fileUrl : json.fileUrl;
          }
          alert("¡Comprobante adjuntado con éxito!");
          await fetchSheetData(); // Recarga y sincroniza estados y enlaces actualizados desde Sheets
        } else {
          throw new Error();
        }
      } catch (err) {
        alert("Error al subir el comprobante. Intenta nuevamente.");
      } finally {
        pendingUploadOrderId = null;
      }
    });

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // Navegación de pestañas PRODUCTOS y PEDIDOS
    document.getElementById('tabCatalogBtn').onclick = () => {
      document.getElementById('tabCatalogBtn').classList.add('active');
      document.getElementById('tabOrdersBtn').classList.remove('active');
      document.getElementById('paneCatalog').classList.add('active');
      document.getElementById('paneOrders').classList.remove('active');
      document.getElementById('summaryCard').style.display = 'flex';
    };

    document.getElementById('tabOrdersBtn').onclick = () => {
      document.getElementById('tabOrdersBtn').classList.add('active');
      document.getElementById('tabCatalogBtn').classList.remove('active');
      document.getElementById('paneOrders').classList.add('active');
      document.getElementById('paneCatalog').classList.remove('active');
      document.getElementById('summaryCard').style.display = 'none';
      renderOrders();
      fetchSheetData(); // Consulta la hoja para traer los estados más recientes en cada visita
    };

    if (window.lucide) lucide.createIcons();
    fetchSheetData();
  </script>
</body>
</html>
